<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>語録</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@900&text=%E8%AA%9E%E9%8C%B2&display=swap">
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root {
    --paper: #edebe6;
    --surface: #ffffff;
    --ink: #000000;
    --sub: #55524c;
    --red: #d2232a;
    --yellow: #f2b51c;
    --blue: #1d4f9c;
    --rule: 3px;
    --title: "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    --geo: "Jost", "Futura", "Century Gothic", "Hiragino Sans", sans-serif;
    /* 本文の字体に "Noto Sans JP" を入れない。見出し用に「語録」の2文字だけ極太で読み込んでいるため、
       本文にも入れると、本文中の「語」「録」だけがその極太の字体で表示されてしまう */
    --body: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", "Yu Gothic UI", Meiryo, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #000000;
      --surface: #1b1b1b;
      --ink: #edebe6;
      --sub: #a9a59c;
      --red: #e8423f;
      --yellow: #f5c234;
      --blue: #4a7fd6;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--body);
    font-size: 15px;
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
    padding-bottom: env(safe-area-inset-bottom);
  }
  body.intro-on { overflow: hidden; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }
  [hidden] { display: none !important; }

  /* ---------- 見出し ---------- */
  header {
    position: relative;
    height: 168px;
    margin: 0 -16px;
    overflow: hidden;
    border-bottom: 6px solid var(--ink);
  }
  .h-circle, .h-square, .h-tri { position: absolute; transition: transform 0.7s cubic-bezier(0.2, 1.4, 0.4, 1); }
  .h-circle { width: 210px; height: 210px; border-radius: 50%; background: var(--red); right: -58px; top: -70px; }
  .h-square { width: 64px; height: 64px; background: var(--blue); right: 140px; top: 22px; }
  .h-tri {
    width: 0; height: 0; right: 22px; top: 104px;
    border-left: 34px solid transparent; border-right: 34px solid transparent;
    border-bottom: 58px solid var(--yellow);
  }
  body:not(.revealed) .h-circle { transform: scale(0.85); }
  body:not(.revealed) .h-square { transform: rotate(-45deg) scale(0.6); }
  body:not(.revealed) .h-tri { transform: translateY(-24px); }
  h1 {
    position: absolute; left: 16px; bottom: 6px; margin: 0;
    font-family: var(--title); font-weight: 900; font-size: 84px; line-height: 1;
    letter-spacing: -0.04em;
  }
  .total { position: absolute; left: 192px; bottom: 14px; font-family: var(--geo); font-size: 14px; color: var(--sub); }
  .total b { font-weight: 700; font-size: 26px; color: var(--ink); margin-right: 2px; }
  .demo-note { font-size: 12px; color: var(--sub); padding: 8px 0 0; }

  /* ---------- 検索・絞り込み ---------- */
  .tools { position: sticky; top: 0; z-index: 5; background: var(--paper); padding: 12px 0; border-bottom: var(--rule) solid var(--ink); }
  .search {
    width: 100%; font-size: 16px;
    background: var(--surface); border: var(--rule) solid var(--ink); border-radius: 0;
    padding: 9px 12px; outline: none; -webkit-appearance: none; appearance: none;
  }
  .search:focus { box-shadow: 4px 4px 0 var(--yellow); }
  .row { display: flex; gap: 8px; margin-top: 8px; }
  select {
    flex: 1 1 0; min-width: 0; font-size: 14px;
    background: var(--surface); border: var(--rule) solid var(--ink); border-radius: 0;
    padding: 6px 26px 6px 10px; -webkit-appearance: none; appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%), linear-gradient(-45deg, transparent 50%, var(--ink) 50%);
    background-position: calc(100% - 15px) 55%, calc(100% - 9px) 55%;
    background-size: 6px 6px; background-repeat: no-repeat;
    text-overflow: ellipsis;
  }
  .status { display: flex; justify-content: space-between; align-items: baseline; margin: 12px 0 8px; font-size: 13px; color: var(--sub); }
  .status button { background: none; border: 0; padding: 0; color: var(--blue); font-weight: 700; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

  /* ---------- ランダム ---------- */
  .random {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 11px; margin: 0 0 12px;
    background: var(--ink); color: var(--paper); border: 0; border-radius: 0;
    font-weight: 700; letter-spacing: 0.06em; cursor: pointer;
  }
  .random::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--yellow); }
  .random:disabled { opacity: 0.35; cursor: default; }
  .pick { position: relative; background: var(--yellow); border: var(--rule) solid var(--ink); padding: 14px 16px 12px; margin: 0 0 16px; color: #000; }
  .pick-head { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 700; margin-bottom: 4px; }
  .pick-head .acts { display: flex; gap: 14px; }
  .pick-head button { background: none; border: 0; padding: 0; font-weight: 700; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; color: #000; }
  .pick .card { background: transparent; border: 0; padding: 0 0 0 0; margin: 0; color: #000; }
  .pick .card::before, .pick .glyph { display: none; }
  .pick .quote { font-size: 20px; font-weight: 700; }
  .pick .date, .pick .reg { color: #000; }
  .pick.drop { animation: drop 0.45s cubic-bezier(0.2, 1.3, 0.4, 1); }
  @keyframes drop { from { transform: translateY(-14px) rotate(-1.5deg); opacity: 0; } to { transform: none; opacity: 1; } }

  /* ---------- 一覧 ---------- */
  ol.list { list-style: none; margin: 0; padding: 0; }
  .card {
    position: relative;
    background: var(--surface);
    border: var(--rule) solid var(--ink);
    margin: 0 0 12px;
    padding: 14px 44px 12px 26px;
  }
  .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 10px; background: var(--c, transparent); border-right: var(--rule) solid var(--ink); }
  .card[data-color="none"]::before { display: none; }
  .card[data-color="none"] { padding-left: 16px; }
  [data-color="red"] { --c: var(--red); --on-c: #fff; }
  [data-color="blue"] { --c: var(--blue); --on-c: #fff; }
  [data-color="yellow"] { --c: var(--yellow); --on-c: #000; }
  [data-color="black"] { --c: var(--ink); --on-c: var(--paper); }
  .glyph { position: absolute; right: 12px; top: 14px; width: 18px; height: 18px; }
  .glyph[data-shape="circle"] { border-radius: 50%; background: var(--c); }
  .glyph[data-shape="square"] { background: var(--c); }
  .glyph[data-shape="triangle"] { width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-bottom: 18px solid var(--c); }
  .glyph[data-shape="none"] { display: none; }
  .quote {
    margin: 0; font-size: 17px; font-weight: 500; line-height: 1.8;
    white-space: pre-wrap; overflow-wrap: anywhere; word-break: auto-phrase; text-wrap: pretty;
  }
  .quote::before { content: "「"; color: var(--red); font-weight: 700; margin-left: -0.55em; }
  .quote::after { content: "」"; color: var(--red); font-weight: 700; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-top: 10px; font-size: 12.5px; color: var(--sub); }
  .speaker {
    background: var(--c, var(--ink)); color: var(--on-c, var(--paper));
    border: 0; border-radius: 0; padding: 2px 8px; font-weight: 700; font-size: 12.5px; cursor: pointer;
  }
  .speaker:disabled { cursor: default; }
  .date { font-family: var(--geo); font-weight: 500; font-size: 13px; letter-spacing: 0.02em; }
  mark { background: var(--yellow); color: #000; padding: 0 1px; }
  .pick mark { background: #fff; }

  .more {
    display: block; width: 100%; margin: 4px 0 28px; padding: 11px;
    background: transparent; border: var(--rule) solid var(--ink); border-radius: 0;
    font-weight: 700; cursor: pointer;
  }
  .empty { padding: 44px 8px; text-align: center; color: var(--sub); }
  .message { padding: 56px 8px; text-align: center; color: var(--sub); }
  .message strong { display: block; color: var(--ink); font-size: 17px; margin-bottom: 6px; }
  .message .diagnosis { display: block; margin-top: 14px; font-size: 12px; color: var(--sub); overflow-wrap: anywhere; }
  .message button { margin-top: 16px; padding: 9px 18px; background: var(--ink); color: var(--paper); border: 0; font-weight: 700; cursor: pointer; }

  /* ---------- タブ ---------- */
  .tabs { display: flex; margin: 14px 0 0; border: var(--rule) solid var(--ink); }
  .tab {
    flex: 1 1 0; padding: 8px 0; background: var(--surface); color: var(--ink);
    border: 0; border-radius: 0; font-weight: 700; letter-spacing: 0.1em; cursor: pointer;
  }
  .tab + .tab { border-left: var(--rule) solid var(--ink); }
  .tab[aria-selected="true"] { background: var(--ink); color: var(--paper); }

  /* ---------- 相関図 ---------- */
  .map-tools { padding: 12px 0 8px; }
  .map-count { min-height: 1.4em; margin-top: 4px; font-size: 12.5px; color: var(--sub); }
  .map-stage {
    position: relative; height: min(62vh, 540px); min-height: 340px;
    background: var(--surface); border: var(--rule) solid var(--ink); overflow: hidden;
  }
  .map-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  .map-note { position: absolute; inset: 0; display: grid; place-content: center; padding: 24px; text-align: center; color: var(--sub); pointer-events: none; }
  .map-note:empty { display: none; }
  .map-note strong { display: block; color: var(--ink); font-size: 17px; margin-bottom: 6px; }
  .map-note button { margin-top: 14px; padding: 8px 16px; background: var(--ink); color: var(--paper); border: 0; font-weight: 700; cursor: pointer; pointer-events: auto; }
  .map-zoom { position: absolute; right: 8px; bottom: 8px; display: flex; flex-direction: column; gap: 6px; }
  .map-zoom button {
    width: 36px; height: 36px; padding: 0; background: var(--surface);
    border: var(--rule) solid var(--ink); border-radius: 0; font-family: var(--geo); font-weight: 700; font-size: 18px; line-height: 1; cursor: pointer;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 7px;
    background: var(--surface); border: 2px solid var(--ink); border-radius: 0; font-size: 12.5px; font-weight: 700; cursor: pointer;
  }
  .chip i { width: 11px; height: 11px; background: var(--c); border: 2px solid var(--ink); border-radius: 50%; }
  .chip small { font-family: var(--geo); font-weight: 500; font-size: 12px; color: var(--sub); }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .chip[aria-pressed="true"] small { color: var(--paper); }
  .chip[aria-pressed="true"] i { border-color: var(--paper); }
  .group-info { margin: 14px 0 0; }
  .gi-head { display: flex; align-items: center; gap: 10px; margin: 0 0 6px; }
  .gi-head .ctag { margin: 0; }
  .gi-count { font-size: 12.5px; color: var(--sub); }
  .gi-close {
    margin-left: auto; padding: 2px 10px; background: var(--surface); color: var(--ink);
    border: 2px solid var(--ink); border-radius: 0; font-size: 12.5px; font-weight: 700; cursor: pointer;
  }
  .gi-note { margin: 0 0 8px; font-size: 12px; color: var(--sub); }
  .nb.cur { background: var(--ink); color: var(--paper); }
  .nb.cur .nb-s { color: var(--paper); }
  .map-info { margin: 14px 0 0; }
  .ctag { display: inline-block; margin: 0 0 8px; padding: 1px 9px; background: var(--c); color: var(--on-c); border: 2px solid var(--ink); font-weight: 700; font-size: 12.5px; }
  .nb-title { margin: 16px 0 6px; font-size: 13px; font-weight: 700; }
  .nb {
    display: block; width: 100%; margin: 0 0 6px; padding: 8px 12px; text-align: left;
    background: var(--surface); border: 2px solid var(--ink); border-radius: 0; cursor: pointer;
  }
  .nb-q { display: block; font-size: 14px; line-height: 1.6; overflow-wrap: anywhere; }
  .nb-s { display: block; margin-top: 2px; font-size: 12px; color: var(--sub); }
  .map-foot { margin: 14px 0 28px; font-size: 12px; color: var(--sub); }
  .who-bar {
    display: flex; align-items: center; gap: 10px; margin: 10px 0 0; padding: 6px 10px;
    background: var(--yellow); color: #000; border: 2px solid var(--ink); font-size: 13px; font-weight: 700;
  }
  .who-bar button {
    margin-left: auto; padding: 1px 10px; background: var(--surface); color: var(--ink);
    border: 2px solid var(--ink); border-radius: 0; font-size: 12.5px; font-weight: 700; cursor: pointer;
  }

  /* ---------- 傾向 ---------- */
  .trait-note { color: var(--sub); text-align: center; }
  .trait-note:not(:empty) { padding: 44px 8px; }
  .trait-note strong { display: block; color: var(--ink); font-size: 17px; margin-bottom: 6px; }
  .trait-note button { margin-top: 14px; padding: 8px 16px; background: var(--ink); color: var(--paper); border: 0; font-weight: 700; cursor: pointer; }
  .trait-lead { margin: 16px 0 4px; font-size: 12.5px; color: var(--sub); }
  .trait-h { margin: 22px 0 8px; font-size: 14px; font-weight: 700; letter-spacing: 0.06em; }
  .pair {
    display: flex; align-items: baseline; gap: 8px; margin: 0 0 6px; padding: 7px 12px;
    background: var(--surface); border: 2px solid var(--ink); font-size: 14px;
  }
  .pair b { font-weight: 700; }
  .pair .x { color: var(--sub); }
  .pair .v { margin-left: auto; font-family: var(--geo); font-size: 12.5px; color: var(--sub); white-space: nowrap; }
  .tc { background: var(--surface); border: var(--rule) solid var(--ink); margin: 0 0 14px; padding: 14px 16px 12px; }
  .tc-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 0 0 4px; }
  .tc-name { margin: 0; font-size: 18px; font-weight: 700; overflow-wrap: anywhere; }
  .tc-n { font-size: 12.5px; color: var(--sub); }
  .tc-line { margin: 10px 0 0; font-size: 13.5px; }
  .tc-line small { color: var(--sub); }
  .tc-label { margin: 12px 0 4px; font-size: 12px; font-weight: 700; color: var(--sub); letter-spacing: 0.06em; }
  .bar-row { display: grid; grid-template-columns: minmax(0, 9em) 1fr; align-items: center; gap: 8px; margin: 0 0 5px; font-size: 12.5px; }
  .bar-row .ctag { margin: 0; justify-self: start; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar { position: relative; height: 16px; background: var(--paper); border: 2px solid var(--ink); }
  .bar > i { position: absolute; left: 0; top: 0; bottom: 0; }
  .bar > span { position: absolute; left: 6px; top: -1px; font-family: var(--geo); font-size: 11.5px; font-weight: 700; line-height: 16px; mix-blend-mode: normal; color: var(--ink); text-shadow: 0 0 3px var(--surface), 0 0 3px var(--surface); }
  .tq { margin: 0 0 5px; padding: 6px 10px; background: var(--paper); border-left: 6px solid var(--ink); font-size: 13.5px; line-height: 1.6; overflow-wrap: anywhere; }
  .tq.odd { border-left-color: var(--red); }
  .tc-acts { display: flex; gap: 8px; margin: 12px 0 0; }
  .tc-acts button {
    padding: 4px 12px; background: var(--surface); color: var(--ink);
    border: 2px solid var(--ink); border-radius: 0; font-size: 12.5px; font-weight: 700; cursor: pointer;
  }
  .tc-acts button:first-child { background: var(--ink); color: var(--paper); }
  .trait-skip { margin: 4px 0 28px; font-size: 12px; color: var(--sub); }

  /* ---------- 起動アニメーション ---------- */
  #intro {
    position: fixed; inset: 0; z-index: 50;
    background: var(--paper);
    display: grid; place-items: center;
    overflow: hidden;
    cursor: pointer;
  }
  .stage { position: relative; width: 300px; height: 300px; }
  .i-bar { position: absolute; left: -40vw; right: -40vw; top: 196px; height: 14px; background: var(--ink); transform: scaleX(0); transform-origin: left; }
  .i-circle { position: absolute; left: 14px; top: 20px; width: 170px; height: 170px; border-radius: 50%; background: var(--red); transform: scale(0); }
  .i-square { position: absolute; left: 160px; top: 96px; width: 100px; height: 100px; background: var(--blue); transform: translateX(60vw) rotate(180deg); }
  .i-tri {
    position: absolute; left: 196px; top: 8px; width: 0; height: 0;
    border-left: 46px solid transparent; border-right: 46px solid transparent; border-bottom: 80px solid var(--yellow);
    transform: translateY(-60vh);
  }
  .i-title {
    position: absolute; left: 10px; top: 214px;
    font-family: var(--title); font-weight: 900; font-size: 76px; line-height: 1; letter-spacing: -0.04em;
    clip-path: inset(100% 0 0 0);
  }
  .i-sub { position: absolute; left: 170px; top: 258px; font-size: 13px; font-weight: 700; opacity: 0; }
  .i-wait { position: absolute; left: 170px; top: 232px; display: flex; gap: 8px; opacity: 0; }
  .i-wait span { width: 12px; height: 12px; background: var(--ink); }
  .i-wait span:nth-child(1) { border-radius: 50%; background: var(--red); }
  .i-wait span:nth-child(2) { background: var(--blue); }
  .i-wait span:nth-child(3) { width: 0; height: 0; background: none; border-left: 7px solid transparent; border-right: 7px solid transparent; border-bottom: 12px solid var(--yellow); }

  #intro.play .i-bar { animation: bar 0.45s cubic-bezier(0.7, 0, 0.2, 1) forwards; }
  #intro.play .i-circle { animation: pop 0.6s 0.2s cubic-bezier(0.2, 1.5, 0.4, 1) forwards; }
  #intro.play .i-square { animation: slide 0.6s 0.38s cubic-bezier(0.2, 1, 0.3, 1) forwards; }
  #intro.play .i-tri { animation: fall 0.55s 0.55s cubic-bezier(0.3, 1.4, 0.5, 1) forwards; }
  #intro.play .i-title { animation: rise 0.45s 0.85s cubic-bezier(0.2, 0.9, 0.3, 1) forwards; }
  #intro.play .i-sub { animation: fade 0.3s 1.15s forwards; }
  #intro.waiting .i-wait { opacity: 1; }
  #intro.waiting .i-sub { visibility: hidden; }
  #intro.waiting .i-wait span { animation: blink 0.9s infinite; }
  #intro.waiting .i-wait span:nth-child(2) { animation-delay: 0.15s; }
  #intro.waiting .i-wait span:nth-child(3) { animation-delay: 0.3s; }
  #intro.leave { animation: lift 0.65s cubic-bezier(0.7, 0, 0.3, 1) forwards; }
  #intro.leave .i-wait { opacity: 0; }

  @keyframes bar { to { transform: scaleX(1); } }
  @keyframes pop { to { transform: scale(1); } }
  @keyframes slide { to { transform: none; } }
  @keyframes fall { to { transform: none; } }
  @keyframes rise { to { clip-path: inset(0 0 0 0); } }
  @keyframes fade { to { opacity: 1; } }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.15; } }
  @keyframes lift { to { transform: translateY(-100%); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div id="intro" aria-hidden="true">
  <div class="stage">
    <div class="i-bar"></div>
    <div class="i-circle"></div>
    <div class="i-square"></div>
    <div class="i-tri"></div>
    <div class="i-title">語録</div>
    <div class="i-sub">名言と迷言の保管庫</div>
    <div class="i-wait"><span></span><span></span><span></span></div>
  </div>
</div>

<div class="wrap">
  <header>
    <span class="h-circle" aria-hidden="true"></span>
    <span class="h-square" aria-hidden="true"></span>
    <span class="h-tri" aria-hidden="true"></span>
    <h1>語録</h1>
    <span class="total" id="total"></span>
  </header>
  <div class="demo-note" id="demoNote" hidden>お試し表示です。並んでいるのは架空のデータです</div>

  <div id="app" hidden>
    <nav class="tabs" role="tablist" aria-label="表示の切り替え">
      <button class="tab" type="button" role="tab" data-tab="list" aria-selected="true">一覧</button>
      <button class="tab" type="button" role="tab" data-tab="map" aria-selected="false">相関図</button>
      <button class="tab" type="button" role="tab" data-tab="trait" aria-selected="false">傾向</button>
    </nav>

    <div id="listView">
    <div class="tools">
      <input class="search" id="q" type="search" placeholder="言葉や発話者で検索" autocomplete="off" enterkeyhint="search" aria-label="検索">
      <div class="row">
        <select id="speaker" aria-label="発話者"></select>
        <select id="month" aria-label="期間"></select>
        <select id="sort" aria-label="並び順">
          <option value="new">新しい順</option>
          <option value="old">古い順</option>
        </select>
      </div>
    </div>

    <div class="status">
      <span id="count"></span>
      <span><button id="clear" type="button" hidden>条件をクリア</button></span>
    </div>

    <button class="random" id="random" type="button">ランダムに1つ選ぶ</button>
    <div class="pick" id="pick" hidden>
      <div class="pick-head">
        <span>ランダムに選んだ語録</span>
        <span class="acts"><button id="again" type="button">もう1回</button><button id="close" type="button">閉じる</button></span>
      </div>
      <div id="pickBody"></div>
    </div>

    <ol class="list" id="list"></ol>
    <div class="empty" id="empty" hidden>条件に合う語録はありません。条件をクリアすると全件に戻ります</div>
    <button class="more" id="more" type="button" hidden></button>
    </div>

    <div id="mapView" hidden>
      <div class="map-tools">
        <input class="search" id="mq" type="search" placeholder="相関図の中を検索" autocomplete="off" enterkeyhint="search" aria-label="相関図の中を検索">
        <div class="map-count" id="mapCount"></div>
      </div>
      <div class="map-stage" id="mapStage">
        <canvas id="mapCanvas" role="img" aria-label="語録の相関図。意味の近い語録ほど近くに並びます"></canvas>
        <div class="map-note" id="mapNote"></div>
        <div class="map-zoom">
          <button id="zoomIn" type="button" aria-label="拡大">+</button>
          <button id="zoomOut" type="button" aria-label="縮小">−</button>
          <button id="zoomFit" type="button" aria-label="全体を見る">□</button>
        </div>
      </div>
      <div class="who-bar" id="whoBar" hidden></div>
      <div class="chips" id="mapChips"></div>
      <div class="map-info" id="mapInfo" hidden></div>
      <div class="group-info" id="groupInfo" hidden></div>
      <div class="map-foot" id="mapFoot"></div>
    </div>

    <div id="traitView" hidden>
      <div class="trait-note" id="traitNote"></div>
      <div id="traitBody"></div>
    </div>
  </div>

  <div class="message" id="message"><strong>読み込み中</strong></div>
</div>

<script>
// ---- ここを書き換える ------------------------------------------------
const LIFF_ID = '2012159085-Vv6wIdgk';           // 例: 1234567890-AbCdEfGh(本番用のLIFF ID)
const API_URL = 'https://script.google.com/macros/s/AKfycbw7UqwiYnt_VmQudKsL4wfqemQFvieQ16R5355R5WWqP7aDmM-vcBm4M3-Rj2sb_HoO/exec';           // 例: https://script.google.com/macros/s/xxxx/exec
// ----------------------------------------------------------------------

const PAGE_SIZE = 60;
const state = { all: [], filtered: [], query: '', speaker: '', month: '', sort: 'new', shown: PAGE_SIZE, pickIndex: -1 };
const $ = (id) => document.getElementById(id);

/* ---------- 検索用の文字の正規化 ---------- */
function toHiragana(s) {
  return s.replace(/[ァ-ヶ]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0x60));
}
function toKatakana(s) {
  return s.replace(/[ぁ-ゖ]/g, (c) => String.fromCharCode(c.charCodeAt(0) + 0x60));
}
/** 全角半角・大文字小文字・ひらがなカタカナの違いをそろえる */
function norm(s) {
  return toHiragana(String(s).normalize('NFKC').toLowerCase());
}
function keywords(query) {
  return query.split(/[\s　]+/).map((w) => w.trim()).filter(Boolean);
}

/* ---------- 絞り込み ---------- */
function monthKey(t) {
  if (!t) return '';
  const d = new Date(t);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
function applyFilters() {
  const words = keywords(state.query).map(norm);
  let list = state.all.filter((item) => {
    if (state.speaker && item.s !== state.speaker) return false;
    if (state.month && monthKey(item.t) !== state.month) return false;
    if (words.length === 0) return true;
    const hay = item._n;
    return words.every((w) => hay.indexOf(w) !== -1);
  });
  if (state.sort === 'old') list = list.slice().reverse();
  state.filtered = list;
}

/* ---------- 表示 ---------- */
function formatDate(t) {
  if (!t) return '';
  const d = new Date(t);
  return d.getFullYear() + '.' + (d.getMonth() + 1) + '.' + d.getDate();
}

/** 本文を、検索語の部分に印を付けて組み立てる(HTMLとしては扱わない) */
function highlighted(text, query) {
  const frag = document.createDocumentFragment();
  const words = keywords(query);
  if (words.length === 0) { frag.appendChild(document.createTextNode(text)); return frag; }

  const variants = [];
  words.forEach((w) => {
    [w, w.normalize('NFKC'), toHiragana(w), toKatakana(w)].forEach((v) => { if (v && variants.indexOf(v) === -1) variants.push(v); });
  });
  const pattern = new RegExp(variants.map((v) => v.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).sort((a, b) => b.length - a.length).join('|'), 'gi');

  let last = 0;
  text.replace(pattern, (m, offset) => {
    if (offset > last) frag.appendChild(document.createTextNode(text.slice(last, offset)));
    const mark = document.createElement('mark');
    mark.textContent = m;
    frag.appendChild(mark);
    last = offset + m.length;
    return m;
  });
  if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
  return frag;
}

const SPEAKER_STYLES = [];
['red', 'blue', 'yellow', 'black'].forEach((color) => {
  ['circle', 'square', 'triangle'].forEach((shape) => SPEAKER_STYLES.push({ color: color, shape: shape }));
});
/** 発話者名から、色と図形の組み合わせを1つ決める */
function speakerStyle(name) {
  if (!name) return { color: 'none', shape: 'none' };
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return SPEAKER_STYLES[h % SPEAKER_STYLES.length];
}

function card(item, tag) {
  const el = document.createElement(tag || 'li');
  el.className = 'card';
  const style = speakerStyle(item.s);
  el.dataset.color = style.color;
  const glyph = document.createElement('span');
  glyph.className = 'glyph';
  glyph.dataset.shape = style.shape;
  glyph.setAttribute('aria-hidden', 'true');
  el.appendChild(glyph);

  const q = document.createElement('p');
  q.className = 'quote';
  q.appendChild(highlighted(item.q, state.query));
  el.appendChild(q);

  const meta = document.createElement('div');
  meta.className = 'meta';
  if (item.s) {
    const sp = document.createElement('button');
    sp.type = 'button';
    sp.className = 'speaker';
    sp.dataset.color = style.color;
    sp.appendChild(highlighted(item.s, state.query));
    if (state.speaker === item.s) sp.disabled = true;
    sp.addEventListener('click', () => { setSpeaker(item.s); });
    meta.appendChild(sp);
  }
  if (item.t) {
    const d = document.createElement('span');
    d.className = 'date';
    d.textContent = formatDate(item.t);
    meta.appendChild(d);
  }
  if (item.r && item.r !== item.s) {
    const r = document.createElement('span');
    r.className = 'reg';
    r.textContent = '登録 ' + item.r;
    meta.appendChild(r);
  }
  el.appendChild(meta);
  return el;
}

function render() {
  applyFilters();
  const list = $('list');
  list.textContent = '';
  const items = state.filtered.slice(0, state.shown);
  items.forEach((item) => list.appendChild(card(item)));

  const n = state.filtered.length;
  const filtering = state.query || state.speaker || state.month;
  $('count').textContent = filtering ? n + '件 見つかりました' : '';
  $('clear').hidden = !filtering;
  $('empty').hidden = n !== 0;
  $('random').disabled = n === 0;

  const rest = n - items.length;
  $('more').hidden = rest <= 0;
  $('more').textContent = 'もっと見る(残り' + rest + '件)';

  renderPick();
}

function renderPick() {
  const body = $('pickBody');
  body.textContent = '';
  const item = state.pickIndex >= 0 ? state.filtered[state.pickIndex] : null;
  $('pick').hidden = !item;
  if (item) body.appendChild(card(item, 'div'));
}

function pickRandom() {
  const n = state.filtered.length;
  if (n === 0) return;
  let i = Math.floor(Math.random() * n);
  if (n > 1 && i === state.pickIndex) i = (i + 1 + Math.floor(Math.random() * (n - 1))) % n;
  state.pickIndex = i;
  renderPick();
  const panel = $('pick');
  panel.classList.remove('drop');
  void panel.offsetWidth; // アニメーションを最初からやり直す
  panel.classList.add('drop');
  $('pick').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function setSpeaker(name) {
  showTab('list');
  state.speaker = name;
  $('speaker').value = name;
  state.shown = PAGE_SIZE;
  state.pickIndex = -1;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function buildSelectors() {
  const counts = {};
  state.all.forEach((item) => { if (item.s) counts[item.s] = (counts[item.s] || 0) + 1; });
  const speakers = Object.keys(counts).sort((a, b) => counts[b] - counts[a] || a.localeCompare(b, 'ja'));
  const sp = $('speaker');
  sp.textContent = '';
  sp.appendChild(new Option('発話者', ''));
  speakers.forEach((s) => sp.appendChild(new Option(s + '(' + counts[s] + ')', s)));

  const months = Array.from(new Set(state.all.map((item) => monthKey(item.t)).filter(Boolean))).sort().reverse();
  const mo = $('month');
  mo.textContent = '';
  mo.appendChild(new Option('期間', ''));
  months.forEach((m) => {
    const [y, mm] = m.split('-');
    mo.appendChild(new Option(y + '年' + Number(mm) + '月', m));
  });
}

function start(quotes) {
  state.all = quotes.map((item) => Object.assign({}, item, { _n: norm(item.q + '\n' + (item.s || '')) }));
  const total = $('total');
  total.textContent = '';
  const num = document.createElement('b');
  num.textContent = state.all.length;
  total.appendChild(num);
  total.appendChild(document.createTextNode('件'));
  buildSelectors();
  $('message').hidden = true;
  $('app').hidden = false;
  render();
  intro.ready();
}

function showMessage(title, detail, retry, diagnosis) {
  const box = $('message');
  box.textContent = '';
  const strong = document.createElement('strong');
  strong.textContent = title;
  box.appendChild(strong);
  if (detail) box.appendChild(document.createTextNode(detail));
  if (diagnosis) {
    // 原因を調べるための情報(どこで止まったか)
    const d = document.createElement('small');
    d.className = 'diagnosis';
    d.textContent = diagnosis;
    box.appendChild(d);
  }
  if (retry) {
    const b = document.createElement('button');
    b.className = 'btn';
    b.type = 'button';
    b.textContent = '読み込み直す';
    b.addEventListener('click', () => location.reload());
    box.appendChild(document.createElement('br'));
    box.appendChild(b);
  }
  box.hidden = false;
  $('app').hidden = true;
  intro.ready();
}

/* ---------- 起動アニメーション ----------
 * 図形が組み上がって「語録」が出るまでを最低1.4秒見せ、データの準備ができたら幕を上げる。
 * データが遅いときは、組み上がった画面のまま図形が順に点滅して待つ。タップで早送りできる。
 * 端末で「視差効果を減らす」が有効なら、アニメーションは出さない
 */
const intro = (function () {
  const el = $('intro');
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let dataReady = false;
  let minDone = false;
  let finished = false;

  function finish() {
    if (finished || !dataReady || !minDone) return;
    finished = true;
    document.body.classList.add('revealed');
    el.classList.add('leave');
    setTimeout(() => { el.hidden = true; document.body.classList.remove('intro-on'); }, 700);
  }

  if (reduce) {
    el.hidden = true;
    document.body.classList.add('revealed');
    finished = true;
  } else {
    document.body.classList.add('intro-on');
    el.classList.add('play');
    setTimeout(() => { minDone = true; el.classList.add('waiting'); finish(); }, 1400);
    el.addEventListener('click', () => { minDone = true; finish(); });
  }

  return { ready: function () { dataReady = true; finish(); } };
})();

/* ---------- 相関図 ----------
 * 語録を意味の近さで平面に並べた図。座標・グループ・近い語録はPC側で計算してあり、ここでは描くだけ。
 * 形と色は一覧と同じく発話者。近くに集まったものがグループで、点線で囲んで名前を付ける。
 * 点をタップすると、その語録と、意味が近い語録が出る。つまんで拡大、ドラッグで移動
 */
const MAP_TAG_COLORS = ['red', 'blue', 'yellow', 'black'];
const MAP_REDUCE_MOTION = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const mp = {
  ready: false, loading: false, bound: false,
  canvas: null, ctx: null, w: 0, h: 0, dpr: 1,
  points: [], clusters: [], clusterById: new Map(), edges: [], quoteByText: new Map(),
  view: { cx: 0, cy: 0, scale: 1 }, fit: 1, fitted: false,
  selected: -1, group: -1, who: '', memberKeys: null, hover: -1, match: null, labels: [],
  colors: null, font: '', drawQueued: false, tween: null,
};
const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));

function readMapColors() {
  const cs = getComputedStyle(document.documentElement);
  const get = (name) => cs.getPropertyValue(name).trim();
  mp.colors = { paper: get('--paper'), surface: get('--surface'), ink: get('--ink'), sub: get('--sub'), red: get('--red'), yellow: get('--yellow'), blue: get('--blue') };
  mp.font = getComputedStyle(document.body).fontFamily;
}
function mapFill(name) {
  if (name === 'black' || !mp.colors[name]) return mp.colors.ink;
  return mp.colors[name];
}
function mapOnColor(name) {
  return name === 'yellow' ? '#000000' : (name === 'black' ? mp.colors.paper : '#ffffff');
}

/* ---------- 傾向(メンバーごとの語録の特徴) ---------- */
const TRAIT_MIN = 5;   // この件数に満たない人は、偏りが読み取れないので傾向を出さない

/** 発話者名の照合用の鍵(空白・全角半角・大文字小文字の違いをそろえる) */
function speakerKey(s) {
  return String(s === null || s === undefined ? '' : s).normalize('NFKC').toLowerCase().replace(/\s+/g, '');
}

/**
 * 相関図のデータ(位置・グループ・近い語録)だけから、発話者ごとの特徴を計算する。サーバーでの計算は要らない。
 *   groups   : その人の語録がどのグループに多いか(全体の割合と比べた倍率つき)
 *   spread   : 語録の広がり(その人の語録が図の上でどれだけ散らばっているか。全体の散らばりを1とする)
 *   typical  : その人の語録の中心に近い語録(この人らしい)。odd は中心から最も遠い語録
 *   partners : 語録の隣に並ぶ相手(近さ = 隣に並ぶ割合 ÷ 偶然の割合。1より大きいほど近い)
 */
function computeTraits() {
  const pts = mp.points, N = pts.length;
  const overall = new Map();
  let gx = 0, gy = 0;
  pts.forEach((p) => { overall.set(p.c, (overall.get(p.c) || 0) + 1); gx += p.x; gy += p.y; });
  gx /= N; gy /= N;
  const gSpread = pts.reduce((a, p) => a + Math.hypot(p.x - gx, p.y - gy), 0) / N || 1;

  const byKey = new Map();
  pts.forEach((p, i) => {
    if (!p.k) return;
    if (!byKey.has(p.k)) byKey.set(p.k, { key: p.k, idx: [], names: new Map() });
    const e = byKey.get(p.k);
    e.idx.push(i);
    e.names.set(p.s, (e.names.get(p.s) || 0) + 1);
  });

  const people = [], small = [], outsiders = [];
  byKey.forEach((e) => {
    e.name = Array.from(e.names.entries()).sort((a, b) => b[1] - a[1])[0][0];
    e.n = e.idx.length;
    if (mp.memberKeys && !mp.memberKeys.has(e.key)) outsiders.push(e);
    else if (e.n < TRAIT_MIN) small.push(e);
    else people.push(e);
  });
  people.sort((a, b) => b.n - a.n);

  people.forEach((e) => {
    let cx = 0, cy = 0;
    e.idx.forEach((i) => { cx += pts[i].x; cy += pts[i].y; });
    cx /= e.n; cy /= e.n;
    e.spread = e.idx.reduce((a, i) => a + Math.hypot(pts[i].x - cx, pts[i].y - cy), 0) / e.n / gSpread;

    const cnt = new Map();
    e.idx.forEach((i) => cnt.set(pts[i].c, (cnt.get(pts[i].c) || 0) + 1));
    e.groups = Array.from(cnt.entries()).map(([c, k]) => {
      const all = overall.get(c) / N;
      return { c: c, cnt: k, share: k / e.n, all: all, lift: (k / e.n) / all };
    }).sort((a, b) => b.cnt - a.cnt);

    const ranked = e.idx.map((i) => [i, Math.hypot(pts[i].x - cx, pts[i].y - cy)]).sort((a, b) => a[1] - b[1]);
    const seen = new Set();
    e.typical = [];
    for (let r = 0; r < ranked.length && e.typical.length < 3; r++) {
      const t = pts[ranked[r][0]].q;
      if (!seen.has(t)) { seen.add(t); e.typical.push(ranked[r][0]); }
    }
    e.odd = -1;
    if (e.n >= 8) {
      for (let r = ranked.length - 1; r >= 0; r--) {
        if (!seen.has(pts[ranked[r][0]].q)) { e.odd = ranked[r][0]; break; }
      }
    }
  });

  // 広がりの目安は、メンバーの中での順位(4人以上のとき)。少ないときは全体との比
  const order = people.map((e) => e.spread).sort((a, b) => a - b);
  people.forEach((e) => {
    if (people.length >= 4) {
      const r = order.indexOf(e.spread);
      e.spreadLabel = r < people.length / 3 ? '話題が一か所に集まっている'
        : (r >= people.length * 2 / 3 ? '話題があちこちに散らばっている' : '話題の広がりはふつう');
    } else {
      e.spreadLabel = e.spread < 0.85 ? '話題が一か所に集まっている' : (e.spread > 1.1 ? '話題があちこちに散らばっている' : '話題の広がりはふつう');
    }
  });

  // 近さ: a の語録の「近い語録」のうち b のものが占める割合を、偶然に当たる割合で割る。a→b と b→a の幾何平均
  const P = people.length;
  const slot = new Map(people.map((e, j) => [e.key, j]));
  const flow = people.map(() => new Float64Array(P));
  const flowAll = new Float64Array(P);
  people.forEach((e, a) => e.idx.forEach((i) => (pts[i].nb || []).forEach((nb) => {
    const other = pts[nb[0]];
    if (!other || other.k === e.key) return;
    const w = Math.max(nb[1], 0.01);
    flowAll[a] += w;
    const b = slot.get(other.k);
    if (b !== undefined) flow[a][b] += w;
  })));
  const ALPHA = 1.5; // 少ない件数で極端な値にならないための補正
  const lift = (a, b) => {
    const expect = people[b].n / (N - people[a].n);
    return ((flow[a][b] + ALPHA * expect) / (flowAll[a] + ALPHA)) / expect;
  };
  const pairs = [];
  for (let a = 0; a < P; a++) {
    for (let b = a + 1; b < P; b++) pairs.push({ a: a, b: b, s: Math.sqrt(lift(a, b) * lift(b, a)) });
  }
  people.forEach((e, a) => {
    e.partners = pairs.filter((p) => p.a === a || p.b === a)
      .map((p) => ({ who: people[p.a === a ? p.b : p.a], s: p.s }))
      .sort((x, y) => y.s - x.s);
  });
  return { people: people, small: small, outsiders: outsiders, pairs: pairs, total: N };
}

function mk(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}
const cutText = (s, n) => (s.length > n ? s.slice(0, n) + '…' : s);
const pct = (x) => Math.round(x * 100) + '%';
const fmtLift = (s) => (s < 0.1 ? '0.1 倍未満' : s.toFixed(1) + ' 倍');

function renderTraits() {
  const body = $('traitBody');
  body.textContent = '';
  if (!mp.ready || mp.points.length === 0) return;
  if (!mp.colors) readMapColors();
  const t = computeTraits();

  body.appendChild(mk('p', 'trait-lead', mp.memberKeys
    ? 'グループのメンバー ' + t.people.length + ' 人の語録を、相関図のデータから集計しています(語録 ' + t.total + ' 件のうち、' + t.people.reduce((a, e) => a + e.n, 0) + ' 件)。'
    : 'メンバーの名簿が取れなかったので、発話者として登録されている全員を集計しています。'));
  if (t.people.length === 0) {
    body.appendChild(mk('p', 'trait-skip', TRAIT_MIN + ' 件以上の語録がある発話者が、まだいません。'));
    return;
  }

  if (t.people.length >= 3) {
    const sorted = t.pairs.slice().sort((x, y) => y.s - x.s);
    const near = sorted.filter((p) => p.s > 1).slice(0, 3);
    const far = sorted.slice().reverse().filter((p) => p.s < 1).slice(0, 2);
    const section = (title, list) => {
      if (list.length === 0) return;
      body.appendChild(mk('h2', 'trait-h', title));
      list.forEach((p) => {
        const row = mk('div', 'pair');
        row.appendChild(mk('b', '', t.people[p.a].name));
        row.appendChild(mk('span', 'x', '×'));
        row.appendChild(mk('b', '', t.people[p.b].name));
        row.appendChild(mk('span', 'v', fmtLift(p.s)));
        body.appendChild(row);
      });
    };
    section('語録が近い組', near);
    section('語録が遠い組', far);

function fetchMapData() {
  if (state.demo) return Promise.resolve(demoMap());
  const token = (typeof liff !== 'undefined' && liff.getIDToken) ? liff.getIDToken() : null;
  if (!token) return Promise.reject(new Error('ログインの情報がありません。開き直してください'));
  return fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'map', idToken: token }) })
    .then((res) => res.text())
    .then((body) => {
      let data;
      try { data = JSON.parse(body); } catch (e) { throw new Error('APIの応答が読めませんでした'); }
      if (data.ok) return data.map;
      if (data.error === 'unknown_action') throw new Error('APIがまだ相関図に対応していません');
      const t = ERROR_TEXT[data.error] || ['読み込みに失敗しました', ''];
      throw new Error(t[0] + (t[1] ? '。' + t[1] : ''));
    });
}

function loadMap() {
  mp.loading = true;
  setMapNote('相関図を読み込み中');
  fetchMapData()
    .then((data) => {
      mp.loading = false;
      if (!data || !data.points || data.points.length === 0) {
        setMapNote('相関図はまだ作られていません', '語録が増えて、PCでの計算が終わると表示されます。');
        return;
      }
      buildMap(data);
      mp.ready = true;
      setMapNote('');
      resizeMap(true);
      renderTraits();
    })
    .catch((err) => {
      mp.loading = false;
      console.error(err);
      setMapNote('読み込めませんでした', err.message || '', true);
    });
}

/* ---------- データの組み立て ---------- */
function convexHull(pts) {
  const p = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  if (p.length < 3) return p;
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lower = [];
  p.forEach((q) => {
    while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], q) <= 0) lower.pop();
    lower.push(q);
  });
  const upper = [];
  for (let i = p.length - 1; i >= 0; i--) {
    const q = p[i];
    while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], q) <= 0) upper.pop();
    upper.push(q);
  }
  upper.pop();
  lower.pop();
  return lower.concat(upper);
}
/** メンバーのうち、中心(中央値)から遠い順に cut の割合だけ除いたもの。6点未満なら全員 */
function coreMembers(members, cut) {
  if (members.length < 6) return members.slice();
  const xs = members.map((i) => mp.points[i].x).sort((a, b) => a - b);
  const ys = members.map((i) => mp.points[i].y).sort((a, b) => a - b);
  const mx = xs[xs.length >> 1], my = ys[ys.length >> 1];
  const ranked = members.map((i) => [i, Math.hypot(mp.points[i].x - mx, mp.points[i].y - my)]).sort((a, b) => a[1] - b[1]);
  const keep = Math.max(3, Math.ceil(ranked.length * (1 - cut)));
  return ranked.slice(0, keep).map((e) => e[0]);
}
function polygonArea(poly) {
  let a = 0;
  for (let i = 0; i < poly.length; i++) {
    const p = poly[i], q = poly[(i + 1) % poly.length];
    a += p[0] * q[1] - q[0] * p[1];
  }
  return Math.abs(a) / 2;
}
function pointInPolygon(x, y, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
/** 外形を、中心から離れる向きに pad だけ広げる(点が縁にぎりぎり載らないように) */
function inflateHull(hull, pad) {
  let cx = 0, cy = 0;
  hull.forEach((q) => { cx += q[0]; cy += q[1]; });
  cx /= hull.length; cy /= hull.length;
  return hull.map((q) => {
    const dx = q[0] - cx, dy = q[1] - cy, d = Math.hypot(dx, dy) || 1;
    return [q[0] + dx / d * pad, q[1] + dy / d * pad];
  });
}

function buildMap(data) {
  mp.points = data.points.map((p) => ({
    i: p.i, q: String(p.q), s: p.s || '', m: Math.max(1, Number(p.m) || 1),
    x: Number(p.x) || 0, y: Number(p.y) || 0, c: Number(p.c) || 0,
    n: Array.isArray(p.n) ? p.n : [], nb: [],
    _n: norm(String(p.q) + '\n' + (p.s || '')),
  }));
  const byId = new Map();
  mp.points.forEach((p, idx) => byId.set(p.i, idx));
  mp.points.forEach((p) => {
    p.nb = p.n.map((e) => [byId.get(e[0]), e[1]]).filter((e) => e[0] !== undefined);
  });

  const names = new Map((data.clusters || []).map((c) => [Number(c.c), String(c.name || '')]));
  const groups = new Map();
  mp.points.forEach((p, idx) => {
    if (!groups.has(p.c)) groups.set(p.c, []);
    groups.get(p.c).push(idx);
  });
  mp.clusters = Array.from(groups.keys()).sort((a, b) => a - b).map((id, index) => {
    const members = groups.get(id);
    let cx = 0, cy = 0;
    members.forEach((i) => { cx += mp.points[i].x; cy += mp.points[i].y; });
    cx /= members.length; cy /= members.length;
    // 範囲は、中心から遠く離れた少数の点(外れ値)を除いて囲む。1点のために範囲が大きく広がらないように
    const core = coreMembers(members, 0.12);
    const hull = core.length >= 3 ? inflateHull(convexHull(core.map((i) => [mp.points[i].x, mp.points[i].y])), 0.07) : null;
    return {
      id: id, index: index, name: names.get(id) || ('グループ' + (id + 1)), color: MAP_TAG_COLORS[id % MAP_TAG_COLORS.length],
      members: members, core: core, cx: cx, cy: cy, hull: hull && hull.length >= 3 ? hull : null,
      area: hull && hull.length >= 3 ? polygonArea(hull) : 0,
    };
  });
  mp.clusterById = new Map(mp.clusters.map((c) => [c.id, c]));

  // 全体に薄く引く線は、各語録の近い上位3件(重複は1本にまとめる)。多すぎる図では引かない
  mp.edges = [];
  if (mp.points.length <= 1500) {
    const seen = new Set();
    mp.points.forEach((p, i) => p.nb.slice(0, 3).forEach((e) => {
      const j = e[0];
      const key = i < j ? i + '-' + j : j + '-' + i;
      if (!seen.has(key)) { seen.add(key); mp.edges.push([i, j]); }
    }));
  }

  mp.quoteByText = new Map();
  state.all.forEach((item) => {
    const key = item.q.trim();
    if (!mp.quoteByText.has(key)) mp.quoteByText.set(key, item);
  });

  // 発話者の名前は、空白・全角半角・大文字小文字の違いをそろえた鍵で突き合わせる
  mp.points.forEach((p) => { p.k = speakerKey(p.s); });
  mp.memberKeys = Array.isArray(data.members) && data.members.length
    ? new Set(data.members.map(speakerKey).filter((k) => k)) : null;

  mp.selected = -1;
  mp.group = -1;
  mp.who = '';
  mp.hover = -1;
  mp.match = null;
  mp.fitted = false;
  $('mq').value = '';
  $('mapCount').textContent = '';
  renderMapChips();
  renderMapInfo();
  renderGroupInfo();
  renderWhoBar();

  const have = new Set(mp.points.map((p) => p.q));
  let missing = 0;
  new Set(state.all.map((item) => item.q.trim())).forEach((t) => { if (!have.has(t)) missing++; });
  $('mapFoot').textContent = '語録 ' + mp.points.length + ' 件 / ' + mp.clusters.length + ' グループ'
    + (data.updated ? ' / 更新 ' + data.updated : '')
    + (missing > 0 ? '(新しい語録 ' + missing + ' 件は、次の更新で入ります)' : '');
}

/* ---------- 視点の操作 ---------- */
function toScreenX(x) { return (x - mp.view.cx) * mp.view.scale + mp.w / 2; }
function toScreenY(y) { return (y - mp.view.cy) * mp.view.scale + mp.h / 2; }

function moveView(cx, cy, scale, animate) {
  const v = mp.view;
  if (!animate || MAP_REDUCE_MOTION) {
    v.cx = cx; v.cy = cy; v.scale = scale;
  } else {
    mp.tween = { t0: performance.now(), dur: 300, from: { cx: v.cx, cy: v.cy, scale: v.scale }, to: { cx: cx, cy: cy, scale: scale } };
  }
  requestDraw();
}

function fitView(indices, animate) {
  if (mp.points.length === 0 || !mp.w) return;
  const all = !indices || indices.length === 0;
  const list = (all ? mp.points.map((_, i) => i) : indices).map((i) => mp.points[i]);
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  if (all && list.length >= 20) {
    // 全体を見るときは、端の2%ずつ(遠くに離れた点)を除いて収める。1点のために図全体が小さくならないように
    const xs = list.map((p) => p.x).sort((a, b) => a - b);
    const ys = list.map((p) => p.y).sort((a, b) => a - b);
    const lo = Math.floor(list.length * 0.02), hi = Math.ceil(list.length * 0.98) - 1;
    x0 = xs[lo]; x1 = xs[hi]; y0 = ys[lo]; y1 = ys[hi];
  } else {
    list.forEach((p) => {
      x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x);
      y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y);
    });
  }
  const scale = Math.min(mp.w / Math.max(x1 - x0, 0.25), mp.h / Math.max(y1 - y0, 0.25)) * 0.8;
  if (all) mp.fit = scale;
  moveView((x0 + x1) / 2, (y0 + y1) / 2, scale, animate);
}

/** グループを選ぶ。範囲を図に濃く出し、そこへ視点を寄せ、語録の一覧を出す */
function selectGroup(index) {
  const cl = mp.clusters[index];
  if (!cl) return;
  mp.group = index;
  selectPoint(-1);
  renderGroupInfo();
  // 範囲の外形がすべて収まるように寄せる(範囲が画面の端で切れないように)
  const pts = cl.hull || (cl.core.length ? cl.core : cl.members).map((i) => [mp.points[i].x, mp.points[i].y]);
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  pts.forEach((q) => {
    x0 = Math.min(x0, q[0]); x1 = Math.max(x1, q[0]);
    y0 = Math.min(y0, q[1]); y1 = Math.max(y1, q[1]);
  });
  const scale = Math.min(mp.w / Math.max(x1 - x0, 0.25), mp.h / Math.max(y1 - y0, 0.25)) * 0.85;
  moveView((x0 + x1) / 2, (y0 + y1) / 2, scale, true);
  requestDraw();
}

/** グループの選択を外す。zoomOut が true なら、全体が見える位置に戻す */
function clearGroup(zoomOut) {
  mp.group = -1;
  renderGroupInfo();
  if (zoomOut) fitView(null, true);
  requestDraw();
}

/** 同じグループをもう一度押すと、選択を外して全体に戻る */
function toggleGroup(index) {
  if (mp.group === index) clearGroup(true); else selectGroup(index);
}

/** 画面上の位置にある範囲のグループ(重なっていれば、小さい方)。無ければ -1 */
function groupAt(px, py) {
  const wx = (px - mp.w / 2) / mp.view.scale + mp.view.cx;
  const wy = (py - mp.h / 2) / mp.view.scale + mp.view.cy;
  let best = -1, bestArea = Infinity;
  mp.clusters.forEach((cl) => {
    if (cl.hull && cl.area < bestArea && pointInPolygon(wx, wy, cl.hull)) { best = cl.index; bestArea = cl.area; }
  });
  return best;
}

function selectPoint(idx, pan, quiet) {
  mp.selected = idx;
  renderMapInfo();
  document.querySelectorAll('#groupInfo .nb').forEach((b) => b.classList.toggle('cur', Number(b.dataset.idx) === idx));
  if (idx >= 0 && pan) {
    const p = mp.points[idx];
    moveView(p.x, p.y, Math.max(mp.view.scale, mp.fit * 2.5), true);
  }
  if (idx >= 0 && !quiet) $('mapInfo').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  requestDraw();
}

function zoomAt(px, py, factor) {
  const v = mp.view;
  const wx = (px - mp.w / 2) / v.scale + v.cx, wy = (py - mp.h / 2) / v.scale + v.cy;
  v.scale = clamp(v.scale * factor, mp.fit * 0.6, mp.fit * 80);
  v.cx = wx - (px - mp.w / 2) / v.scale;
  v.cy = wy - (py - mp.h / 2) / v.scale;
  requestDraw();
}

function pinchState(pointers) {
  const pair = Array.from(pointers.values());
  return { x: (pair[0].x + pair[1].x) / 2, y: (pair[0].y + pair[1].y) / 2, d: Math.max(1, Math.hypot(pair[0].x - pair[1].x, pair[0].y - pair[1].y)) };
}
function pinchMove(prev, now) {
  const v = mp.view;
  const wx = (prev.x - mp.w / 2) / v.scale + v.cx, wy = (prev.y - mp.h / 2) / v.scale + v.cy;
  v.scale = clamp(v.scale * now.d / prev.d, mp.fit * 0.6, mp.fit * 80);
  v.cx = wx - (now.x - mp.w / 2) / v.scale;
  v.cy = wy - (now.y - mp.h / 2) / v.scale;
  requestDraw();
}

function pointAt(px, py) {
  let best = -1, bestD = 18 * 18;
  for (let i = 0; i < mp.points.length; i++) {
    const p = mp.points[i];
    const dx = toScreenX(p.x) - px, dy = toScreenY(p.y) - py;
    const d = dx * dx + dy * dy;
    if (d <= bestD) { bestD = d; best = i; }
  }
  return best;
}

function handleTap(x, y) {
  for (let i = 0; i < mp.labels.length; i++) {
    const l = mp.labels[i];
    if (x >= l.x && x <= l.x + l.w && y >= l.y && y <= l.y + l.h) { toggleGroup(l.index); return; }
  }
  const hit = pointAt(x, y);
  if (hit >= 0) { selectPoint(hit); return; }

  // 点でも名前でもない所は、範囲の中ならそのグループを選び、範囲の外なら選択を外す
  const g = groupAt(x, y);
  if (g >= 0 && g !== mp.group) { selectGroup(g); return; }
  if (mp.selected >= 0) { selectPoint(-1); return; }
  if (g < 0 && mp.group >= 0) clearGroup(false);
}

function resizeMap(refit) {
  if (!mp.canvas) return;
  const stage = $('mapStage');
  const w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  const dpr = window.devicePixelRatio || 1;
  if (w !== mp.w || h !== mp.h || dpr !== mp.dpr) {
    mp.w = w; mp.h = h; mp.dpr = dpr;
    mp.canvas.width = Math.round(w * dpr);
    mp.canvas.height = Math.round(h * dpr);
  }
  if (mp.points.length && (refit || !mp.fitted)) {
    fitView(null, false);
    mp.fitted = true;
  }
  requestDraw();
}

function bindMap() {
  if (mp.bound) return;
  mp.bound = true;
  mp.canvas = $('mapCanvas');
  mp.ctx = mp.canvas.getContext('2d');
  const canvas = mp.canvas;
  const pointers = new Map();
  let gesture = null;
  let pinch = null;
  const local = (e) => {
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  };

  canvas.addEventListener('pointerdown', (e) => {
    canvas.setPointerCapture(e.pointerId);
    const p = local(e);
    pointers.set(e.pointerId, p);
    mp.tween = null;
    if (pointers.size === 1) {
      gesture = { moved: 0, t0: Date.now() };
    } else if (pointers.size === 2) {
      pinch = pinchState(pointers);
      if (gesture) gesture.moved = 99;
    }
  });
  canvas.addEventListener('pointermove', (e) => {
    const p = local(e);
    if (!pointers.has(e.pointerId)) {
      if (e.pointerType === 'mouse') {
        const hit = pointAt(p.x, p.y);
        if (hit !== mp.hover) {
          mp.hover = hit;
          canvas.style.cursor = hit >= 0 ? 'pointer' : 'grab';
          requestDraw();
        }
      }
      return;
    }
    const prev = pointers.get(e.pointerId);
    pointers.set(e.pointerId, p);
    if (pointers.size === 1) {
      const v = mp.view;
      v.cx -= (p.x - prev.x) / v.scale;
      v.cy -= (p.y - prev.y) / v.scale;
      if (gesture) gesture.moved += Math.abs(p.x - prev.x) + Math.abs(p.y - prev.y);
      requestDraw();
    } else if (pointers.size === 2 && pinch) {
      const now = pinchState(pointers);
      pinchMove(pinch, now);
      pinch = now;
    }
  });
  const finish = (e) => {
    const p = local(e);
    const tap = gesture && pointers.size === 1 && gesture.moved < 6 && Date.now() - gesture.t0 < 600 && e.type === 'pointerup';
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinch = null;
    if (pointers.size === 0) gesture = null;
    if (tap) handleTap(p.x, p.y);
  };
  canvas.addEventListener('pointerup', finish);
  canvas.addEventListener('pointercancel', finish);
  canvas.addEventListener('pointerleave', () => {
    if (mp.hover !== -1) { mp.hover = -1; requestDraw(); }
  });
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const p = local(e);
    zoomAt(p.x, p.y, Math.exp(-e.deltaY * 0.0015));
  }, { passive: false });

  $('zoomIn').addEventListener('click', () => zoomAt(mp.w / 2, mp.h / 2, 1.5));
  $('zoomOut').addEventListener('click', () => zoomAt(mp.w / 2, mp.h / 2, 1 / 1.5));
  $('zoomFit').addEventListener('click', () => { selectPoint(-1); mp.group = -1; renderGroupInfo(); fitView(null, true); });

  let mapSearchTimer = null;
  $('mq').addEventListener('input', (e) => {
    clearTimeout(mapSearchTimer);
    mapSearchTimer = setTimeout(() => applyMapSearch(e.target.value), 120);
  });
  $('mq').addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    e.target.blur();
    if (mp.match && mp.match.size) fitView(Array.from(mp.match), true);
  });

  if (window.ResizeObserver) new ResizeObserver(() => resizeMap()).observe($('mapStage'));
  else window.addEventListener('resize', () => resizeMap());
  if (window.matchMedia) {
    const dark = window.matchMedia('(prefers-color-scheme: dark)');
    const onChange = () => { readMapColors(); requestDraw(); };
    if (dark.addEventListener) dark.addEventListener('change', onChange);
  }
}

function applyMapSearch(value) {
  const words = keywords(value).map(norm);
  if (words.length === 0) {
    mp.match = null;
    $('mapCount').textContent = '';
  } else {
    const hit = new Set();
    mp.points.forEach((p, i) => { if (words.every((w) => p._n.indexOf(w) !== -1)) hit.add(i); });
    mp.match = hit;
    $('mapCount').textContent = hit.size + '件 見つかりました';
  }
  requestDraw();
}

/* ---------- 描画 ---------- */
function requestDraw() {
  if (mp.drawQueued) return;
  mp.drawQueued = true;
  requestAnimationFrame(() => { mp.drawQueued = false; drawMap(); });
}

function glyphPath(ctx, shape, x, y, r) {
  ctx.beginPath();
  if (shape === 'square') {
    ctx.rect(x - r, y - r, r * 2, r * 2);
  } else if (shape === 'triangle') {
    ctx.moveTo(x, y - r * 1.2);
    ctx.lineTo(x + r * 1.15, y + r * 0.85);
    ctx.lineTo(x - r * 1.15, y + r * 0.85);
    ctx.closePath();
  } else {
    ctx.arc(x, y, r, 0, Math.PI * 2);
  }
}

function drawMap() {
  const ctx = mp.ctx;
  if (!ctx || !mp.w || !mp.colors) return;

  if (mp.tween) {
    const t = Math.min(1, (performance.now() - mp.tween.t0) / mp.tween.dur);
    const e = 1 - Math.pow(1 - t, 3);
    const a = mp.tween.from, b = mp.tween.to, v = mp.view;
    v.cx = a.cx + (b.cx - a.cx) * e;
    v.cy = a.cy + (b.cy - a.cy) * e;
    v.scale = a.scale * Math.pow(b.scale / a.scale, e);
    if (t >= 1) mp.tween = null; else requestDraw();
  }

  const c = mp.colors, w = mp.w, h = mp.h, v = mp.view;
  const sel = mp.selected >= 0 ? mp.points[mp.selected] : null;
  const near = sel ? new Set(sel.nb.map((e) => e[0])) : null;

  ctx.setTransform(mp.dpr, 0, 0, mp.dpr, 0, 0);
  ctx.fillStyle = c.surface;
  ctx.fillRect(0, 0, w, h);

  // グループの範囲。ふだんはグループの色で薄く塗って点線で囲み、選んだグループだけ濃く塗って実線で囲む
  const group = mp.group >= 0 ? mp.clusters[mp.group] : null;
  mp.clusters.forEach((cl) => {
    const chosen = group === cl;
    ctx.beginPath();
    if (cl.hull) {
      // 角を丸めた外形(各辺の中点を結び、頂点を制御点にする)
      const hs = cl.hull.map((q) => [toScreenX(q[0]), toScreenY(q[1])]);
      const m = hs.map((q, i) => { const r = hs[(i + 1) % hs.length]; return [(q[0] + r[0]) / 2, (q[1] + r[1]) / 2]; });
      ctx.moveTo(m[m.length - 1][0], m[m.length - 1][1]);
      hs.forEach((q, i) => ctx.quadraticCurveTo(q[0], q[1], m[i][0], m[i][1]));
      ctx.closePath();
    } else {
      ctx.arc(toScreenX(cl.cx), toScreenY(cl.cy), 0.09 * v.scale, 0, Math.PI * 2);
    }
    ctx.globalAlpha = chosen ? 0.24 : (group || sel ? 0.03 : 0.1);
    ctx.fillStyle = mapFill(cl.color);
    ctx.fill();
    ctx.globalAlpha = chosen ? 1 : (group || sel ? 0.2 : 0.55);
    ctx.strokeStyle = c.ink;
    ctx.lineWidth = chosen ? 3.5 : 2;
    ctx.setLineDash(chosen ? [] : [6, 5]);
    ctx.stroke();
    ctx.setLineDash([]);
  });

  // 近い語録どうしを結ぶ薄い線
  ctx.globalAlpha = sel ? 0.06 : 0.16;
  ctx.strokeStyle = c.ink;
  ctx.lineWidth = 1;
  ctx.beginPath();
  mp.edges.forEach((e) => {
    const a = mp.points[e[0]], b = mp.points[e[1]];
    ctx.moveTo(toScreenX(a.x), toScreenY(a.y));
    ctx.lineTo(toScreenX(b.x), toScreenY(b.y));
  });
  ctx.stroke();

  // 選んだ語録から、近い語録への線
  if (sel) {
    ctx.globalAlpha = 0.9;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    sel.nb.forEach((e) => {
      const q = mp.points[e[0]];
      ctx.moveTo(toScreenX(sel.x), toScreenY(sel.y));
      ctx.lineTo(toScreenX(q.x), toScreenY(q.y));
    });
    ctx.stroke();
  }

  // 語録の点(形と色は発話者)
  const grow = clamp(Math.pow(v.scale / mp.fit, 0.25), 0.9, 1.7);
  ctx.lineWidth = 2;
  ctx.strokeStyle = c.ink;
  mp.points.forEach((p, i) => {
    const X = toScreenX(p.x), Y = toScreenY(p.y);
    if (X < -24 || X > w + 24 || Y < -24 || Y > h + 24) return;
    let alpha = 1;
    if (sel && i !== mp.selected && !near.has(i)) alpha = 0.22;
    else if (!sel && ((group && p.c !== group.id) || (mp.who && p.k !== mp.who))) alpha = 0.2;
    if (mp.match && !mp.match.has(i)) alpha = Math.min(alpha, 0.14);
    const style = speakerStyle(p.s);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = style.color === 'none' ? c.surface : mapFill(style.color);
    glyphPath(ctx, style.shape === 'none' ? 'circle' : style.shape, X, Y, (5.5 + Math.min(4, Math.sqrt(p.m - 1) * 2)) * grow);
    ctx.fill();
    ctx.stroke();
  });
  ctx.globalAlpha = 1;

  if (sel) {
    ctx.lineWidth = 3;
    ctx.strokeStyle = c.ink;
    ctx.beginPath();
    ctx.arc(toScreenX(sel.x), toScreenY(sel.y), 15 * grow, 0, Math.PI * 2);
    ctx.stroke();
  }

  // グループの名前
  mp.labels = [];
  ctx.font = '700 12px ' + mp.font;
  ctx.textBaseline = 'middle';
  mp.clusters.forEach((cl) => {
    const tw = ctx.measureText(cl.name).width;
    const bw = tw + 14, bh = 22;
    // 名前は範囲の上辺に置く(点を隠さないように)。範囲が無い小さなグループは中心に置く
    const X = toScreenX(cl.cx);
    const Y = cl.hull ? toScreenY(Math.min.apply(null, cl.hull.map((q) => q[1]))) - bh / 2 - 2 : toScreenY(cl.cy);
    const bx = clamp(X - bw / 2, 4, Math.max(4, w - bw - 4)), by = clamp(Y - bh / 2, 4, Math.max(4, h - bh - 4));
    if (X < -bw || X > w + bw || Y < -bh || Y > h + bh) return;
    ctx.globalAlpha = (sel && sel.c !== cl.id) || (!sel && group && group !== cl) ? 0.45 : 1;
    ctx.fillStyle = mapFill(cl.color);
    ctx.fillRect(bx, by, bw, bh);
    ctx.lineWidth = 2;
    ctx.strokeStyle = c.ink;
    ctx.strokeRect(bx, by, bw, bh);
    ctx.fillStyle = mapOnColor(cl.color);
    ctx.fillText(cl.name, bx + 7, by + bh / 2 + 1);
    mp.labels.push({ x: bx, y: by, w: bw, h: bh, index: cl.index });
  });
  ctx.globalAlpha = 1;

  // マウスを乗せたときの吹き出し
  if (mp.hover >= 0 && mp.hover !== mp.selected) {
    const p = mp.points[mp.hover];
    const text = p.q.length > 28 ? p.q.slice(0, 28) + '…' : p.q;
    const tw = ctx.measureText(text).width + 14;
    const X = clamp(toScreenX(p.x) - tw / 2, 4, Math.max(4, w - tw - 4));
    const Y = Math.max(4, toScreenY(p.y) - 38);
    ctx.fillStyle = c.ink;
    ctx.fillRect(X, Y, tw, 22);
    ctx.fillStyle = c.paper;
    ctx.fillText(text, X + 7, Y + 12);
  }
}

/** お試し表示(?demo)用の、架空の相関図 */
function demoMap() {
  const names = ['神経の島', '試験の島', '授業の島', '雑談の島'];
  const centers = [[-0.55, -0.35], [0.5, -0.4], [-0.35, 0.5], [0.55, 0.45]];
  let seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const gauss = () => (rnd() + rnd() + rnd() + rnd() - 2) * 0.5;
  const points = state.all.map((it, i) => {
    const c = (i + Math.floor(i / 4)) % names.length;
    return { i: i, q: it.q, s: it.s, m: 1, c: c, x: centers[c][0] + gauss() * 0.45, y: centers[c][1] + gauss() * 0.45, n: [] };
  });
  points.forEach((p) => {
    p.n = points.filter((o) => o !== p)
      .map((o) => [o.i, 1 - Math.hypot(o.x - p.x, o.y - p.y) / 2])
      .sort((a, b) => b[1] - a[1]).slice(0, 5)
      .map((e) => [e[0], Math.round(e[1] * 1000) / 1000]);
  });
  return {
    updated: 'お試し',
    points: points,
    clusters: names.map((name, c) => ({ c: c, name: name, size: points.filter((p) => p.c === c).length })),
    members: Array.from(new Set(points.map((p) => p.s).filter((s) => s))),
  };
}

/* ---------- 読み込み ---------- */
const ERROR_TEXT = {
  not_member: ['このページはグループのメンバーだけが見られます', '語録のグループに参加しているLINEアカウントで開いてください。'],
  invalid_token: ['ログインの確認に失敗しました', '時間がたっている場合があります。開き直してください。'],
  unavailable: ['LINE側で確認ができませんでした', '少し時間をおいて開き直してください。'],
  not_configured: ['ページの準備がまだ終わっていません', '管理役に知らせてください。'],
};

/** どこで止まったかを添えたエラー */
function stepError(step, err) {
  const e = new Error(step + ': ' + ((err && err.message) || String(err)));
  e.step = step;
  return e;
}

function loadFromApi(idToken) {
  return fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'quotes', idToken: idToken }) })
    .catch((err) => { throw stepError('APIへの通信', err); })
    .then((res) => res.text().then((body) => {
      try {
        return JSON.parse(body);
      } catch (e) {
        const html = /^\s*</.test(body) ? '。JSONではなくHTMLのページが返っています' : '';
        throw stepError('APIの応答', new Error('HTTP ' + res.status + html));
      }
    }))
    .then((data) => {
      if (data.ok) { start(data.quotes || []); return; }
      const t = ERROR_TEXT[data.error] || ['読み込みに失敗しました', ''];
      showMessage(t[0], t[1], data.error !== 'not_member', 'APIの判定: ' + data.error);
    });
}

function main() {
  const params = new URLSearchParams(location.search);
  if (params.has('demo')) {
    $('demoNote').hidden = false;
    state.demo = true;
    start(demoQuotes());
    return;
  }
  if (LIFF_ID.indexOf('ここに') === 0 || API_URL.indexOf('ここに') === 0) {
    showMessage('ページの準備がまだ終わっていません', 'LIFF_ID と API_URL を書き込んでください。');
    return;
  }
  if (typeof liff === 'undefined') {
    showMessage('読み込みに失敗しました', 'LINEのアプリから開き直してください。', true, 'LIFFの読み込み: LINEの部品を読み込めませんでした');
    return;
  }
  liff.init({ liffId: LIFF_ID })
    .catch((err) => { throw stepError('LIFFの初期化', err); })
    .then(() => {
      if (!liff.isLoggedIn()) { liff.login(); return; }
      const token = liff.getIDToken();
      if (!token) {
        showMessage('ログインの確認に失敗しました', 'ミニアプリの設定で openid の権限が有効か、管理役に確認してください。');
        return;
      }
      return loadFromApi(token);
    })
    .catch((err) => {
      console.error(err);
      showMessage('読み込みに失敗しました', '通信の状態を確かめて、開き直してください。', true, err.message);
    });
}

    '「なんとなく」で覚えると、本番で「なんとなく」間違えます', '休憩にしましょう。5分と言って10分です',

    '臨床に出たら、今日の話を思い出す日が必ず来ます', '質問は、その場でしたほうが得です',
    'テストの範囲は、私の気分です。冗談です。半分は',
  ];
  const now = Date.now();
  const day = 24 * 60 * 60 * 1000;
  return texts.map((q, i) => ({
    t: now - i * 4.3 * day,
    s: speakers[(i * 7) % speakers.length],
    q: q,
    r: i % 3 === 0 ? '鈴木' : (i % 3 === 1 ? '田中' : speakers[(i * 7) % speakers.length]),
  }));
}

main();
</script>
